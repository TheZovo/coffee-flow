services:
  db:
    image: postgres:16-alpine
    container_name: coffee_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: coffee
      POSTGRES_USER: coffee
      POSTGRES_PASSWORD: coffee
    volumes:
      - coffee_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coffee -d coffee"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: coffee_app
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - coffee_uploads:/app/app/static/uploads

volumes:
  coffee_pg_data:
  coffee_uploads:
